{% extends "account/base.html" %}
{% block title %}Change Password | Learnova{% endblock %}
{% block account_content %}
<div class="auth-header"><h1>Change your password</h1></div>
<form method="post" action="{% url 'account_change_password' %}" class="auth-form">
  {% csrf_token %}
  {% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<span class="form-error">{{ error }}</span>{% endfor %}</div>{% endfor %}
  <button type="submit" class="btn btn-primary btn-full">Update password</button>
</form>
{% endblock %}
