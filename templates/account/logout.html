{% extends "account/base.html" %}
{% block title %}Sign Out | Learnova{% endblock %}
{% block account_content %}
<div class="auth-header"><h1>Sign out?</h1><p>Are you sure you want to sign out?</p></div>
<form method="post" action="{% url 'account_logout' %}" class="auth-form">{% csrf_token %}<button type="submit" class="btn btn-primary btn-full">Sign out</button></form>
{% endblock %}
