{% extends "admin/base_site.html" %}
{% block content %}
<h1>Reject Lesson: {{ lesson.title }}</h1>

<form method="post" style="max-width:600px;margin-top:20px;">
  {% csrf_token %}
  <div style="margin-bottom:16px;">
    <label style="display:block;font-weight:600;margin-bottom:8px;">Rejection Note (shown to contributor)</label>
    <textarea name="rejection_note" rows="5" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:0.9rem;"
      placeholder="Explain what needs to be improved..."></textarea>
  </div>
  <div style="display:flex;gap:10px;">
    <button type="submit" style="background:#ef4444;color:#fff;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;">
      Confirm Rejection
    </button>
    <a href="../" style="padding:8px 18px;border:1px solid #d1d5db;border-radius:6px;text-decoration:none;font-size:0.9rem;">
      Cancel
    </a>
  </div>
</form>
{% endblock %}
